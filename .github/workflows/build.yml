name: Build and Verify

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Connect IQ SDK Manager
      run: |
        curl -s https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sh
        echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Download SDK and Devices
      run: |
        # Accept the license agreement
        connect-iq-sdk-manager agreement accept
        # Install and set the latest 7.x SDK
        connect-iq-sdk-manager sdk download 7.x.x
        connect-iq-sdk-manager sdk set 7.x.x
        # Download device definitions
        connect-iq-sdk-manager device download --manifest=SailStartup/manifest.xml
        # Debug: Print the path to ensure it was set correctly
        echo "SDK Path: $(connect-iq-sdk-manager sdk current-path)"

    - name: Update Version from Git Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        chmod +x scripts/update_version.sh
        ./scripts/update_version.sh $VERSION

    - name: Decode Developer Key
      env:
        DEV_KEY: ${{ secrets.DEVELOPER_KEY_BASE64 }}
      if: env.DEV_KEY != ''
      run: echo "$DEV_KEY" | base64 -d > developer_key.der

    - name: Create Placeholder Key (If Secret Missing)
      env:
        DEV_KEY: ${{ secrets.DEVELOPER_KEY_BASE64 }}
      if: env.DEV_KEY == ''
      run: touch developer_key.der

    - name: Build for Forerunner 255
      run: |
        SDK_BIN=$(connect-iq-sdk-manager sdk current-path --bin)
        # Fallback if current-path fails
        if [ -z "$SDK_BIN" ]; then
          SDK_BIN="$HOME/.garmin/ConnectIQ/Sdks/*/bin"
        fi
        mkdir -p bin
        $SDK_BIN/monkeyc -d fr255 -f SailStartup/monkey.jungle -o bin/SailStartup_fr255.prg -y developer_key.der
