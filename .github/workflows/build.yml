name: Build and Verify

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Update Version from Git Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        chmod +x scripts/update_version.sh
        ./scripts/update_version.sh $VERSION

    - name: Build Sail StartUp
      uses: blackshadev/garmin-connectiq-build-action@v3
      with:
        # The Base64 encoded developer key from your GitHub Secrets
        developer_key_base64: ${{ secrets.DEVELOPER_KEY_BASE64 }}
        # The project directory (relative to repo root)
        project_dir: SailStartup
        # Target device
        devices: fr255
        # SDK version to use
        sdk_version: 7.1.0
