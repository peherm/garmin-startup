name: Build and Verify

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Default to least-privilege; individual jobs elevate as needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Update Version from Git Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        chmod +x scripts/update_version.sh
        ./scripts/update_version.sh $VERSION

    - name: Decode Developer Key
      env:
        DEVELOPER_KEY_BASE64: ${{ secrets.DEVELOPER_KEY_BASE64 }}
      run: |
        echo "$DEVELOPER_KEY_BASE64" | base64 -d > developer_key
        test -s developer_key

    - name: Build Sail StartUp
      uses: blackshadev/garmin-connectiq-build-action@9.1.1
      with:
        projectJungle: SailStartup/monkey.jungle
        developerKey: developer_key
        device: fr255
        typeCheck: '1'
        outputPath: out/SailStartup.prg

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: SailStartup-${{ github.sha }}
        path: out/SailStartup.prg
        if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v8
      with:
        name: SailStartup-${{ github.sha }}
        path: out

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: out/SailStartup.prg
        generate_release_notes: true
        fail_on_unmatched_files: true
